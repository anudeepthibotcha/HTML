<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        /* Styles all div elements inside the container */
        .container div {
            text-align: center;
            padding: 20px;
        }

        /* Creates a grid layout with 3 columns and 2 rows */
        .container {
            border: 3px solid black;
            display: grid;

            /* Creates three columns of automatic width */
            grid-template-columns: auto auto auto;

            /* Creates two rows of automatic height */
            grid-template-rows: auto auto;
        }

        /* i1 occupies the first two columns in the first row */
        #i1 {
            grid-column: 1/3;
            grid-row-start: 1;
        }

        /* i2 occupies the third column and spans both rows */
        #i2 {
            grid-row: 1/3;
            grid-column-start: 3;
        }

        /* i3 is placed in the first column of the second row */
        #i3 {
            grid-row-start: 2;
            grid-column: 1/2;
        }

        /* i4 is placed in the second column of the second row */
        #i4 {
            grid-row-start: 2;
            grid-column: 2/3;
        }
    </style>
</head>

<!-- Sets the background color of the webpage -->
<body style="background-color: darkkhaki;">

    <!-- Main grid container -->
    <div class="container">

        <!-- First image: spans columns 1 and 2 -->
        <div id="i1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwO0wY2zmLQ-AFOwPUfj_GWNfC4AVxIUeIKEocoo0a9g&s=10"
                 width="400px"
                 height="200px">
        </div>

        <!-- Second image: occupies column 3 and spans both rows -->
        <div id="i2">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIAC1kBFD8UgsOayMBHWl9pktJkSO1BuY7ZpdVGmLUMg&s=10"
                 width="300px"
                 height="500px">
        </div>

        <!-- Third image: placed in column 1 of row 2 -->
        <div id="i3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsq_CwZBFZlDz9va9-MpXqDju1fMfJ043Iud2udU6Vaw&s=10"
                 width="300px"
                 height="200px">
        </div>

        <!-- Fourth image: placed in column 2 of row 2 -->
        <div id="i4">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSh9lzR7T3AstGHpw11qA5OLbyPfISdFNCuWyOB6kJvA&s=10"
                 width="300px"
                 height="200px">
        </div>

    </div>
</body>
</html>
