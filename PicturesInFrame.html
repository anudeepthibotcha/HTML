<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container div {
            text-align: center;
            padding: 20px;
        }
        .container {
            border: 3px solid black;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto;
        }
        #i1 {
            grid-column: 1/3;
            grid-row-start: 1;
        }
        #i2 {
            grid-row: 1/3;
            grid-column-start: 3;
        }
        #i3 {
            grid-row-start: 2;
            grid-column: 1/2;
        }
        #i4 {
            grid-row-start: 2;
            grid-column: 2/3;
        }
    </style>
</head>
<body style="background-color: darkkhaki;">
    <div class="container">
        <div id="i1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwO0wY2zmLQ-AFOwPUfj_GWNfC4AVxIUeIKEocoo0a9g&s=10" width="400px" height="200px">
        </div>
        <div id="i2"> 
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIAC1kBFD8UgsOayMBHWl9pktJkSO1BuY7ZpdVGmLUMg&s=10" width="300px" height="500px">
        </div>
        <div id="i3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRsq_CwZBFZlDz9va9-MpXqDju1fMfJ043Iud2udU6Vaw&s=10" width="300px" height="200px">
        </div>
        <div id="i4">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSh9lzR7T3AstGHpw11qA5OLbyPfISdFNCuWyOB6kJvA&s=10" width="300px" height="200px">
        </div>
    </div>
</body>
</html>
